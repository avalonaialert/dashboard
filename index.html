<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avalon Call/Put Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }

    h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
    #last-updated { font-size: 0.75rem; color: #8b949e; }
    #sound-toggle {
      font-size: 0.78rem; cursor: pointer; user-select: none;
      padding: 2px 9px; border-radius: 12px; border: 1px solid #30363d;
      background: #161b22; color: #8b949e; white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    #sound-toggle.on  { border-color: #238636; color: #3fb950; background: #0d2118; }
    #sound-toggle.off { border-color: #30363d; color: #484f58; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .market-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap;
    }
    .market-open   { background:#0d2118; border:1px solid #238636; color:#3fb950; }
    .market-pre    { background:#0d1b2e; border:1px solid #1f6feb; color:#58a6ff; }
    .market-after  { background:#1c1400; border:1px solid #f59e0b; color:#fbbf24; }
    .market-closed { background:#161b22; border:1px solid #30363d; color:#8b949e; }

    /* ── Top movers bar ── */
    #movers-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 24px;
      border-bottom: 1px solid #21262d;
      background: #0d1117;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 36px;
    }

    .movers-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #8b949e;
      margin-right: 4px;
      white-space: nowrap;
    }

    .mover-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0d2118;
      border: 1px solid #238636;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .mover-sym { font-weight: 700; color: #3fb950; }
    .mover-pct { color: #57d97b; font-weight: 600; }

    .spy-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 20px; padding: 3px 12px;
      font-size: 0.78rem; font-weight: 700; white-space: nowrap;
      margin-right: 6px;
    }
    .spy-chip.up   { background: #0d2118; border: 1px solid #238636; color: #3fb950; }
    .spy-chip.down { background: #2d0f0f; border: 1px solid #da3633; color: #f85149; }
    .spy-chip.flat { background: #161b22; border: 1px solid #30363d; color: #8b949e; }
    .spy-label { font-weight: 900; letter-spacing: 0.5px; }
    .spy-pct   { font-weight: 700; }

    /* ── Earnings this week bar ── */
    #earnings-week-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 24px;
      border-bottom: 1px solid #21262d;
      background: #0d1117;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 36px;
    }

    .earnings-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .earnings-chip.bmo { background: #0d1b2e; border: 1px solid #1f6feb; color: #58a6ff; }
    .earnings-chip.amc { background: #1e1b4b; border: 1px solid #6d28d9; color: #c084fc; }
    .earnings-chip.tbd { background: #161b22; border: 1px solid #30363d; color: #8b949e; }
    .earnings-sym  { font-weight: 700; }
    .earnings-date { opacity: 0.85; }
    .earnings-hour { font-weight: 700; font-size: 0.68rem; }

    /* ── Sidebar ── */
    .sidebar {
      width: 148px;
      flex-shrink: 0;
      border-right: 1px solid #21262d;
      padding: 12px 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.22s ease;
    }

    .sidebar.collapsed {
      width: 36px;
      overflow-y: hidden;
    }

    .sidebar.collapsed .sidebar-label,
    .sidebar.collapsed .day-tab { display: none; }

    .sidebar-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 2px 4px 8px;
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-toggle:hover { background: #161b22; color: #e6edf3; }

    .sidebar-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8b949e;
      padding: 6px 16px 4px;
    }

    .day-tab {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 16px;
      font-size: 0.82rem;
      color: #8b949e;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 6px;
      width: calc(100% - 12px);
      transition: background 0.12s, color 0.12s;
    }

    .day-tab:hover { background: #161b22; color: #e6edf3; }

    .day-tab.active {
      background: #1f2d3d;
      color: #58a6ff;
      font-weight: 600;
    }

    /* ── Main content ── */
    .app { display: flex; flex: 1; min-height: 0; }
    .content { flex: 1; padding: 24px; overflow-y: auto; min-width: 0; }
    #status { font-size: 0.82rem; color: #8b949e; margin-bottom: 20px; }

    .hist-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .badge-call { background: #1a4a2e; color: #3fb950; }
    .badge-bear { background: #4a1a1a; color: #f85149; }

    .sym-link { color: inherit; text-decoration: none; }
    .sym-link:hover { text-decoration: underline; }

    /* ── Tile grid (one tile per symbol) ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .tile {
      border-radius: 12px;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-x: hidden;
    }

    .tile-header {
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tile-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tile-symbol { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }

    .tile-close-wrap { text-align: right; }
    .tile-close-label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .tile-close { font-size: 1.05rem; font-weight: 600; }

    .tile-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tile-time-latest { font-size: 0.72rem; color: #8b949e; }

    .tile-gain {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      width: fit-content;
    }
    .tile-gain.pos { background: #1a4a2e; color: #3fb950; }
    .tile-gain.neg { background: #4a1a1a; color: #f85149; }

    .tile-history {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 0 18px 14px;
      margin-top: 4px;
    }

    .history-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8b949e;
      padding: 10px 0 6px;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 8px;
    }
    .history-row:last-child { border-bottom: none; }

    .hist-close { font-size: 0.78rem; color: #e6edf3; white-space: nowrap; flex-shrink: 0; }
    .hist-time  { font-size: 0.68rem; color: #8b949e; white-space: nowrap; flex-shrink: 0; }
    .hist-rsi   { font-size: 0.72rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; color: #8b949e; }
    .hist-rsi.strong { color: #3fb950; }
    .hist-rsi.weak   { color: #fbbf24; }

    /* ── Tile colour themes ── */
    .tile-call { background: #0d2118; border-color: #238636; }
    .tile-bear { background: #2d0f0f; border-color: #da3633; }
    .tile-call .tile-symbol, .tile-call .tile-close { color: #3fb950; }
    .tile-bear .tile-symbol, .tile-bear .tile-close { color: #f85149; }
    .tile-call .tile-badge { background: #1a4a2e; color: #3fb950; }
    .tile-bear .tile-badge { background: #4a1a1a; color: #f85149; }

    .tile.recent {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px #3b82f6, 0 0 24px 6px rgba(59,130,246,0.35);
      animation: tilePulse 2s ease-in-out infinite;
    }
    @keyframes tilePulse {
      0%, 100% { box-shadow: 0 0 0 2px #3b82f6, 0 0 24px 6px rgba(59,130,246,0.35); }
      50%       { box-shadow: 0 0 0 2px #3b82f6, 0 0 36px 10px rgba(59,130,246,0.55); }
    }

    /* ── Recommendation strip ── */
    .tile-rec {
      margin: 0 18px 12px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      border: 1px solid;
      line-height: 1.5;
    }
    .rec-action   { font-weight: 700; display: block; margin-bottom: 1px; }
    .rec-detail   { font-size: 0.7rem; opacity: 0.8; }
    .rec-watch    { background: #161b22; border-color: #30363d; color: #8b949e; }
    .rec-hold     { background: #0d1b2e; border-color: #1f6feb; color: #58a6ff; }
    .rec-sell     { background: #2d0f0f; border-color: #da3633; color: #f85149; }
    .rec-building { background: #161b22; border-color: #30363d; color: #8b949e; }

    /* ── Alerts feed ── */
    .section-title {
      font-size: 0.85rem; font-weight: 600; color: #34d399;
      text-transform: uppercase; letter-spacing: 0.8px;
      margin: 0 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ""; flex: 1; height: 1px; background: #0d3a26; }

    .pos-table-wrap { border-radius: 8px; border: 1px solid #0d3a26; overflow-x: auto; margin-bottom: 32px; }
    .pos-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .pos-table thead th {
      background: #071f14; padding: 10px 14px; text-align: left;
      font-weight: 600; color: #2d9362; text-transform: uppercase;
      font-size: 0.7rem; letter-spacing: 0.6px;
      border-bottom: 1px solid #0d3a26; white-space: nowrap;
    }
    .pos-table tbody tr { border-bottom: 1px solid #0a1f14; transition: background 0.15s; }
    .pos-table tbody tr:last-child { border-bottom: none; }
    .pos-table tbody tr:hover { background: #071f14; }
    .pos-table td { padding: 9px 14px; white-space: nowrap; }

    .pos-symbol { font-weight: 700; font-size: 0.95rem; color: #34d399; }
    .pos-price  { color: #e6edf3; font-weight: 600; }
    .pos-time   { color: #8b949e; font-size: 0.75rem; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #login-overlay.hidden { display: none; }

    .login-box {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-box h2 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #e6edf3;
      text-align: center;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-field input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e6edf3;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .login-field input:focus { border-color: #58a6ff; }

    .login-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .login-btn:hover { background: #2ea043; }

    #login-error {
      font-size: 0.8rem;
      color: #f85149;
      text-align: center;
      min-height: 1.1em;
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Avalon Alerts</h2>
      <div class="login-field">
        <label for="login-user">Username</label>
        <input id="login-user" type="text" autocomplete="username" placeholder="username" />
      </div>
      <div class="login-field">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="password" />
      </div>
      <div id="login-error"></div>
      <button class="login-btn" id="login-btn">Sign In</button>
    </div>
  </div>

  <header>
    <h1>Avalon Call/Put Dashboard</h1>
    <div class="header-right">
      <span id="market-status"></span>
      <button id="sound-toggle" title="Toggle alert sound">🔔 Sound</button>
      <span id="last-updated">—</span>
    </div>
  </header>

  <div id="movers-bar"></div>
  <div id="earnings-week-bar" style="display:none"></div>

  <div class="app">
    <nav class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">◀</button>
      <div class="sidebar-label">Call/Put</div>
    </nav>

    <main class="content">
      <p id="status">Loading…</p>
      <label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:#8b949e;cursor:pointer;white-space:nowrap;margin-bottom:16px;width:fit-content">
        <input type="checkbox" id="show-all-chk" style="cursor:pointer;accent-color:#58a6ff" />
        Show all
      </label>

      <div class="section-title">📋 Today's Call/Put Signals</div>
      <div class="grid" id="grid"></div>

      <div class="section-title">🎯 Pivot-Based Earnings Plays</div>
      <label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:#8b949e;cursor:pointer;white-space:nowrap;margin-bottom:16px;width:fit-content">
        <input type="checkbox" id="earnopts-full-week-chk" style="cursor:pointer;accent-color:#58a6ff" />
        Show full next week
      </label>
      <div class="pos-table-wrap" id="earnopts-wrap" style="display:none">
        <table class="pos-table">
          <thead><tr>
            <th>Symbol</th>
            <th>Earnings</th>
            <th>Price</th>
            <th>Pivot (S1/PP/R1)</th>
            <th>Expiry</th>
            <th>Call Strike</th>
            <th>Call Mid</th>
            <th>Put Strike</th>
            <th>Put Mid</th>
            <th>Capital Needed</th>
          </tr></thead>
          <tbody id="earnopts-tbody"></tbody>
        </table>
      </div>
      <p id="earnopts-empty" style="color:#8b949e;font-size:0.82rem;margin-bottom:32px">No actionable earnings play today (AMC) or next trading day (BMO).</p>

    </main>
  </div>

  <script>
    // ── Auth ─────────────────────────────────────────────────────────────
    (function () {
      const overlay = document.getElementById("login-overlay");
      const errorEl = document.getElementById("login-error");

      function unlock() { overlay.classList.add("hidden"); }

      if (window.location.protocol === "file:" || sessionStorage.getItem("ta_auth") === "1") { unlock(); return; }

      const EU = "__ENCODED_USER__";
      const EP = "__ENCODED_PASS__";

      function encode3(s) { return btoa(btoa(btoa(s))); }

      function attempt() {
        const u = document.getElementById("login-user").value.trim();
        const p = document.getElementById("login-pass").value;
        if (encode3(u) === EU && encode3(p) === EP) {
          sessionStorage.setItem("ta_auth", "1");
          errorEl.textContent = "";
          unlock();
        } else {
          errorEl.textContent = "Invalid username or password.";
          document.getElementById("login-pass").value = "";
        }
      }

      document.getElementById("login-btn").addEventListener("click", attempt);
      document.getElementById("login-pass").addEventListener("keydown", e => {
        if (e.key === "Enter") attempt();
      });
      document.getElementById("login-user").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("login-pass").focus();
      });
    })();

    // ── Sidebar toggle ───────────────────────────────────────────────────
    (function () {
      const sidebar = document.getElementById("sidebar");
      const btn     = document.getElementById("sidebar-toggle");
      btn.addEventListener("click", () => {
        const collapsed = sidebar.classList.toggle("collapsed");
        btn.textContent = collapsed ? "▶" : "◀";
        btn.title       = collapsed ? "Expand sidebar" : "Collapse sidebar";
      });
    })();

    document.getElementById("show-all-chk").addEventListener("change", () => renderTiles());
    document.getElementById("earnopts-full-week-chk").addEventListener("change", () => renderEarningsOptions());

    // ── Alert sound notification ─────────────────────────────────────────
    let _soundEnabled = localStorage.getItem("cp_sound") !== "off";

    function _applySoundToggleUI() {
      const btn = document.getElementById("sound-toggle");
      if (_soundEnabled) {
        btn.textContent = "🔔 Sound";
        btn.className   = "on";
        btn.title       = "Sound alerts on — click to mute";
      } else {
        btn.textContent = "🔕 Muted";
        btn.className   = "off";
        btn.title       = "Sound alerts off — click to enable";
      }
    }

    document.getElementById("sound-toggle").addEventListener("click", () => {
      _soundEnabled = !_soundEnabled;
      localStorage.setItem("cp_sound", _soundEnabled ? "on" : "off");
      _applySoundToggleUI();
      if (_soundEnabled) playAlertTone(); // preview the sound when turning on
    });
    _applySoundToggleUI();

    function playAlertTone() {
      if (!_soundEnabled) return;
      try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.25);
      } catch (_) {}
    }

    const REPO = "avalonaialert/dashboard";
    const CALLPUT_DATA_URL      = `https://api.github.com/repos/${REPO}/contents/call_put_data.json`;
    const CALLPUT_MANIFEST_URL  = `https://api.github.com/repos/${REPO}/contents/call_put_manifest.json`;
    const CALLPUT_HISTORY_URL   = d => `https://api.github.com/repos/${REPO}/contents/call_put_history/${d}.json`;
    const EARNINGS_OPTIONS_URL  = `https://api.github.com/repos/${REPO}/contents/earnings_options.json`;
    const GH_READ_TOKEN = "__GH_READ_TOKEN__"; // injected by CI from GitHub Secret
    const FINNHUB_API_KEY = "d89995pr01qla01mkncgd89995pr01qla01mknd0";  // free key from finnhub.io

    function fmtTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit", hour12: true,
      });
    }

    function fmtTimeOnly(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleTimeString("en-US", {
        timeZone: "America/New_York",
        hour: "2-digit", minute: "2-digit", hour12: true,
      });
    }

    function symLink(sym) {
      return `<a href="https://finviz.com/quote?t=${sym}&p=d" target="_blank" rel="noopener" class="sym-link">${sym}</a>`;
    }

    function fmtDate(iso) {
      return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", {
        timeZone: "America/New_York",
        weekday: "short", month: "short", day: "numeric",
      });
    }

    async function _ghFetch(url) {
      const headers = { "Accept": "application/vnd.github.v3+json" };
      if (GH_READ_TOKEN && !GH_READ_TOKEN.startsWith("__")) {
        headers["Authorization"] = `token ${GH_READ_TOKEN}`;
      }
      const resp = await fetch(url, { cache: "no-store", headers });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} ${url}`);
      const env = await resp.json();
      return JSON.parse(atob(env.content.replace(/\n/g, "")));
    }

    let _callputData      = null;   // currently displayed (today or a history day)
    let _liveData         = null;   // today's live data, kept aside so switching back to "today" is instant
    let _manifest         = [];     // archived dates, from call_put_manifest.json
    let _dayCache         = {};     // date -> {alerts}
    let _activeDay        = "today";
    let _spyQuote         = null;
    let _topGainers       = [];

    function fmtClose(v) { return v != null ? Number(v).toFixed(2) : "—"; }

    function fmtGain(first, latest) {
      if (first == null || latest == null || first === 0) return null;
      const pct = ((latest - first) / first) * 100;
      const sign = pct >= 0 ? "+" : "";
      return { text: `${sign}${pct.toFixed(2)}%`, positive: pct >= 0 };
    }

    function meta(alertCode) {
      return Number(alertCode) === 8
        ? { label: "Call", cls: "tile-call", icon: "▲" }
        : { label: "Put",  cls: "tile-bear", icon: "▼" };
    }

    // Thresholds mirroring call_put.py's .env defaults.
    const REC_RSI_OVERBOUGHT    = 70;
    const REC_RSI_OVERSOLD      = 30;
    const REC_RSI_MOMENTUM_DIFF = 0.5;

    function callPutRec(history) {
      const latest = history[0];
      const prev   = history[1];
      const side   = Number(latest.alert) === 8 ? "call" : "put";
      const rsi    = latest.rsi;
      const prevRsi = prev?.rsi;

      let rsiNote = "";
      let rsiFlag = null; // "extended" | "turning"
      if (rsi != null) {
        const extended = side === "call" ? rsi >= REC_RSI_OVERBOUGHT : rsi <= REC_RSI_OVERSOLD;
        if (extended && prevRsi != null) {
          const diff = rsi - prevRsi;
          const stalling = side === "call" ? diff < REC_RSI_MOMENTUM_DIFF : diff > -REC_RSI_MOMENTUM_DIFF;
          rsiFlag = stalling ? "turning" : "extended";
        } else if (extended) {
          rsiFlag = "extended";
        }
        rsiNote = `RSI ${rsi.toFixed(1)}${prevRsi != null ? ` (prev ${prevRsi.toFixed(1)})` : ""}`;
      }

      const label = rsiFlag === "turning" ? "🟡 Momentum stalling" : "📋 Signal";
      return { action: label, detail: rsiNote || "no RSI data", cls: "rec-building" };
    }

    function renderTiles() {
      const statusEl = document.getElementById("status");
      const grid     = document.getElementById("grid");
      grid.innerHTML = "";

      const alerts = _callputData?.today?.alerts ?? _callputData?.alerts ?? {};
      const symbols = Object.entries(alerts).filter(([, h]) => h && h.length);

      if (!symbols.length) {
        statusEl.textContent = "No signals for this day.";
        return;
      }

      // Sort each symbol's history newest -> oldest
      for (const [, history] of symbols) {
        history.sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
      }
      // Symbols with the most recent overall activity first
      symbols.sort((a, b) => new Date(b[1][0].received_at) - new Date(a[1][0].received_at));

      // Hide symbols with no alert in the last 20 min — but only while the market is
      // actually in session (call_put.py only trades 9:30-16:00 ET) and only for "today".
      // Outside session, or on a "Show all" checkbox, or viewing history: show everything.
      const showAll   = document.getElementById("show-all-chk")?.checked;
      const inSession = getMarketStatus().cls === "market-open";
      const applyFilter = inSession && !showAll && _activeDay === "today";
      const cutoff = Date.now() - 20 * 60 * 1000;
      const visibleSymbols = applyFilter
        ? symbols.filter(([, h]) => new Date(h[0].received_at).getTime() >= cutoff)
        : symbols;

      const hiddenCount = symbols.length - visibleSymbols.length;
      statusEl.textContent = `${visibleSymbols.length} symbol${visibleSymbols.length !== 1 ? "s" : ""}` +
        (hiddenCount > 0 ? ` · ${hiddenCount} older (>20min) hidden` : "");

      visibleSymbols.forEach(([symbol, history]) => {
        const latest = history[0];
        const first  = history[history.length - 1];
        const m      = meta(latest.alert);
        const age      = Date.now() - new Date(latest.received_at).getTime();
        const isRecent = age <= 5 * 60 * 1000;
        const isNew    = age <= 10 * 60 * 1000;

        const tile = document.createElement("div");
        tile.className = `tile ${m.cls}${isRecent ? " recent" : ""}`;
        if (isNew) setTimeout(() => tile.classList.remove("recent"), 10 * 60 * 1000 - age);

        const gain = fmtGain(first.close, latest.close);
        const gainHtml = gain ? `<span class="tile-gain ${gain.positive ? "pos" : "neg"}">${gain.text}</span>` : "";

        const histRows = history.map((h, i) => {
          const hm = meta(h.alert);
          const prevRsi = history[i + 1]?.rsi; // history is newest -> oldest, so i+1 is the prior alert
          let rsiHtml = "";
          if (h.rsi != null) {
            let dirCls = "", arrow = "–";
            if (prevRsi != null) {
              const diff = h.rsi - prevRsi;
              arrow  = diff > 0 ? "▲" : diff < 0 ? "▼" : "▬";
              dirCls = Math.abs(diff) > REC_RSI_MOMENTUM_DIFF ? "strong" : "weak";
            }
            rsiHtml = `<span class="hist-rsi ${dirCls}">${h.rsi.toFixed(1)} ${arrow}</span>`;
          }
          return `<div class="history-row">
            <span class="hist-badge ${hm.cls === "tile-call" ? "badge-call" : "badge-bear"}">${hm.icon} ${hm.label}</span>
            <span class="hist-close">${fmtClose(h.close)}</span>
            ${rsiHtml}
            <span class="hist-time">${fmtTimeOnly(h.received_at)}</span>
          </div>`;
        }).join("");
        const histSection = `<div class="tile-history"><div class="history-label">History (${history.length})</div>${histRows}</div>`;

        const rec = callPutRec(history);
        const recHtml = `<div class="tile-rec ${rec.cls}">
             <span class="rec-action">${rec.action}</span>
             <span class="rec-detail">${rec.detail}</span>
           </div>`;

        tile.innerHTML = `
          <div class="tile-header">
            <div class="tile-top">
              <div class="tile-symbol">${symLink(symbol)}</div>
              <div class="tile-close-wrap">
                <div class="tile-close-label">Close</div>
                <div class="tile-close">${fmtClose(latest.close)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span class="tile-badge">${m.icon} ${m.label}</span>
              ${gainHtml}
            </div>
            <div class="tile-time-latest">${fmtTime(latest.received_at)}</div>
          </div>${recHtml}${histSection}`;
        grid.appendChild(tile);
      });
    }

    function todayDateStrEST() {
      return new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
    }

    function nextTradingDayStrEST() {
      const [y, m, d] = todayDateStrEST().split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      do {
        dt.setUTCDate(dt.getUTCDate() + 1);
      } while (dt.getUTCDay() === 0 || dt.getUTCDay() === 6); // skip Sat/Sun
      return dt.toISOString().slice(0, 10);
    }

    let _earningsOptionsData = null;

    function renderEarningsOptions(data) {
      if (data !== undefined) _earningsOptionsData = data;   // cache so the checkbox can re-render without refetching
      const wrap  = document.getElementById("earnopts-wrap");
      const empty = document.getElementById("earnopts-empty");
      const tbody = document.getElementById("earnopts-tbody");
      const allSymbols = _earningsOptionsData?.symbols ?? [];

      const showFullWeek = document.getElementById("earnopts-full-week-chk")?.checked;

      // Default: only show a play when it's actually actionable right now — an AMC
      // report happening today (buy before the close), or a BMO report on the next
      // trading day (buy before that open). "Show full next week" bypasses this.
      const today = todayDateStrEST();
      const nextTradingDay = nextTradingDayStrEST();
      const symbols = showFullWeek ? allSymbols : allSymbols.filter(s => {
        if (s.earnings_hour === "amc") return s.earnings_date === today;
        if (s.earnings_hour === "bmo") return s.earnings_date === nextTradingDay;
        return s.earnings_date === today || s.earnings_date === nextTradingDay;
      });

      if (!symbols.length) {
        wrap.style.display = "none";
        empty.textContent = showFullWeek
          ? "No watchlist earnings in the next 7 days."
          : "No actionable earnings play today (AMC) or next trading day (BMO).";
        empty.style.display = "block";
        return;
      }
      wrap.style.display = "block";
      empty.style.display = "none";

      const hourLabel = h => h === "bmo" ? "BMO" : h === "amc" ? "AMC" : "TBD";
      const midCell = (leg) => leg?.mid != null ? `$${leg.mid.toFixed(2)}` : "—";

      // Capital rule: buy 1 contract of whichever leg is priced higher, then use
      // that same dollar amount as the budget for the cheaper leg.
      const capitalCell = (call, put) => {
        if (call?.mid == null || put?.mid == null) return "—";
        const [higherLabel, higherMid, lowerLabel, lowerMid] = call.mid >= put.mid
          ? ["CALL", call.mid, "PUT", put.mid]
          : ["PUT", put.mid, "CALL", call.mid];

        const higherCost = higherMid * 100;
        const lowerContracts = Math.floor(higherCost / (lowerMid * 100));
        const lowerSpent = lowerContracts * lowerMid * 100;
        const total = higherCost + higherCost; // same $ budgeted to the lower leg

        return `$${total.toFixed(0)}  (1 ${higherLabel} @ $${higherCost.toFixed(0)} + `
             + `${lowerContracts} ${lowerLabel} @ $${lowerSpent.toFixed(0)})`;
      };

      tbody.innerHTML = symbols.map(s => `
        <tr>
          <td class="pos-symbol">${symLink(s.symbol)}</td>
          <td class="pos-time">${fmtShortDate(s.earnings_date)} (${hourLabel(s.earnings_hour)})</td>
          <td class="pos-price">$${s.price.toFixed(2)}</td>
          <td class="pos-time">${s.pivots.S1.toFixed(2)} / ${s.pivots.PP.toFixed(2)} / ${s.pivots.R1.toFixed(2)}</td>
          <td class="pos-time">${s.expiry}</td>
          <td class="pos-price">$${s.call?.strike?.toFixed(2) ?? "—"}</td>
          <td class="pos-price">${midCell(s.call)}</td>
          <td class="pos-price">$${s.put?.strike?.toFixed(2) ?? "—"}</td>
          <td class="pos-price">${midCell(s.put)}</td>
          <td class="pos-time">${capitalCell(s.call, s.put)}</td>
        </tr>
      `).join("");
    }

    function buildSidebar() {
      const sidebar = document.getElementById("sidebar");
      const toggle  = document.getElementById("sidebar-toggle");
      sidebar.innerHTML = "";
      sidebar.appendChild(toggle);

      const lbl = document.createElement("div");
      lbl.className = "sidebar-label";
      lbl.textContent = "Call/Put";
      sidebar.appendChild(lbl);

      const todayBtn = document.createElement("button");
      todayBtn.className = "day-tab" + (_activeDay === "today" ? " active" : "");
      todayBtn.textContent = "Today";
      todayBtn.onclick = () => setActiveDay("today");
      sidebar.appendChild(todayBtn);

      if (_manifest.length) {
        const hLbl = document.createElement("div");
        hLbl.className = "sidebar-label";
        hLbl.style.marginTop = "16px";
        hLbl.textContent = "History";
        sidebar.appendChild(hLbl);

        _manifest.forEach(dateStr => {
          const btn = document.createElement("button");
          btn.className = "day-tab" + (_activeDay === dateStr ? " active" : "");
          btn.textContent = fmtDate(dateStr);
          btn.onclick = () => setActiveDay(dateStr);
          sidebar.appendChild(btn);
        });
      }
    }

    async function setActiveDay(key) {
      _activeDay = key;
      if (key === "today") {
        _callputData = _liveData;
      } else {
        if (!_dayCache[key]) {
          const day = await _ghFetch(CALLPUT_HISTORY_URL(key)).catch(() => null);
          _dayCache[key] = day || { alerts: {} };
        }
        _callputData = _dayCache[key];
      }
      renderTiles();
      buildSidebar();
    }

    let _hasLoadedOnce = false;

    async function load() {
      const statusEl = document.getElementById("status");
      statusEl.innerHTML = "Loading…";
      try {
        const prevLastUpdated = _liveData?.last_updated;
        const [data, manifest, earnOpts] = await Promise.all([
          _ghFetch(CALLPUT_DATA_URL).catch(() => null),
          _ghFetch(CALLPUT_MANIFEST_URL).catch(() => []),
          _ghFetch(EARNINGS_OPTIONS_URL).catch(() => null),
        ]);
        _liveData = data;
        _manifest = Array.isArray(manifest) ? manifest : [];
        renderEarningsOptions(earnOpts);

        document.getElementById("last-updated").textContent =
          _liveData?.last_updated ? "Updated " + fmtTime(_liveData.last_updated) : "";

        // Sound: only for genuinely new alerts on a refresh tick, never on first page load
        if (_hasLoadedOnce && _liveData?.last_updated && _liveData.last_updated !== prevLastUpdated) {
          const now = Date.now();
          const alerts = _liveData?.today?.alerts ?? {};
          const hasFreshAlert = Object.values(alerts).some(records =>
            records.some(r => now - new Date(r.received_at).getTime() < 3 * 60 * 1000)
          );
          if (hasFreshAlert) playAlertTone();
        }
        _hasLoadedOnce = true;

        buildSidebar();
        if (_activeDay === "today") {
          _callputData = _liveData;
          renderTiles();
        }
        statusEl.innerHTML = "";
      } catch (err) {
        statusEl.innerHTML =
          `Failed to load: ${err.message} ` +
          `<button onclick="load()" style="margin-left:10px;padding:4px 12px;background:#1f2d3d;` +
          `border:1px solid #58a6ff;border-radius:6px;color:#58a6ff;cursor:pointer;font-size:0.8rem;">` +
          `↺ Retry</button>`;
      }
    }

    // ── Top movers bar (SPY quote + market-wide top gainers) ─────────────
    function renderMoversBar() {
      const bar = document.getElementById("movers-bar");
      let html = "";

      if (_spyQuote) {
        const dp   = _spyQuote.dp ?? ((_spyQuote.c - _spyQuote.pc) / _spyQuote.pc * 100);
        const cls  = dp > 0 ? "up" : dp < 0 ? "down" : "flat";
        const sign = dp > 0 ? "+" : "";
        html += `<span class="spy-chip ${cls}">
          <span class="spy-label">SPY</span>
          <span class="spy-pct">${sign}${dp.toFixed(2)}%</span>
        </span>`;
      }

      if (_topGainers.length > 0) {
        html += '<span class="movers-label">Top Gainers</span>' +
          _topGainers.map(s => {
            const pct = s.symbolData.changePct.toFixed(2);
            return `<span class="mover-chip">
              <span class="mover-sym">${symLink(s.cnbcSymbol)}</span>
              <span class="mover-pct">+${pct}%</span>
            </span>`;
          }).join("");
      }

      if (html) bar.innerHTML = html;
    }

    async function loadSpyQuote() {
      if (!FINNHUB_API_KEY || FINNHUB_API_KEY === "YOUR_FINNHUB_KEY") return;
      try {
        const resp = await fetch(
          `https://finnhub.io/api/v1/quote?symbol=SPY&token=${FINNHUB_API_KEY}`,
          { cache: "no-store" }
        );
        if (!resp.ok) return;
        _spyQuote = await resp.json();
        renderMoversBar();
      } catch (_) {}
    }

    async function loadTopMovers() {
      try {
        const resp = await fetch(
          "https://gdsapi.cnbc.com/market-mover/groupMover/MAJOR/CHANGE_PCT/BOTH/5.json?source=SAVED&delayed=false&partnerId=2",
          { cache: "no-store" }
        );
        if (!resp.ok) return;
        const json = await resp.json();
        const topList = json.rankedSymbolList?.find(r => r.rankOrder === "TOP");
        if (!topList) return;
        _topGainers = topList.rankedSymbols.filter(s => s.symbolData.changePct > 0);
        renderMoversBar();
      } catch (_) {
        // CORS or network failure — bar stays as-is
      }
    }

    // ── Earnings this week (fixed watchlist) ──────────────────────────────
    const EARNINGS_WATCHLIST = ["AAPL","AMD","AMZN","AVGO","GOOG","MSFT","MU","NVDA","SNDK","TSLA","WDC"];

    function fmtShortDate(dateStr) {
      return new Date(dateStr + "T12:00:00Z").toLocaleDateString("en-US", {
        timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric",
      });
    }

    async function loadEarningsWeek() {
      if (!FINNHUB_API_KEY || FINNHUB_API_KEY === "YOUR_FINNHUB_KEY") return;
      try {
        const from = new Date();
        const to   = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
        const fmt  = d => d.toISOString().slice(0, 10);
        const resp = await fetch(
          `https://finnhub.io/api/v1/calendar/earnings?from=${fmt(from)}&to=${fmt(to)}&token=${FINNHUB_API_KEY}`,
          { cache: "no-store" }
        );
        if (!resp.ok) return;
        const json = await resp.json();
        const watchSet = new Set(EARNINGS_WATCHLIST);
        const entries = (json.earningsCalendar || [])
          .filter(e => watchSet.has(e.symbol))
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        const bar = document.getElementById("earnings-week-bar");
        if (!entries.length) { bar.style.display = "none"; return; }

        bar.innerHTML = '<span class="movers-label">Earnings This Week</span>' +
          entries.map(e => {
            const hourCls   = e.hour === "bmo" ? "bmo" : e.hour === "amc" ? "amc" : "tbd";
            const hourLabel = e.hour === "bmo" ? "BMO" : e.hour === "amc" ? "AMC" : "TBD";
            return `<span class="earnings-chip ${hourCls}">
              <span class="earnings-sym">${symLink(e.symbol)}</span>
              <span class="earnings-date">${fmtShortDate(e.date)}</span>
              <span class="earnings-hour">${hourLabel}</span>
            </span>`;
          }).join("");
        bar.style.display = "flex";
      } catch (_) {
        // non-critical
      }
    }

    // ── Market hours indicator ───────────────────────────────────────────
    function getMarketStatus() {
      const est  = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
      const day  = est.getDay();
      const mins = est.getHours() * 60 + est.getMinutes();
      if (day === 0 || day === 6 || mins < 240 || mins >= 1200)
        return { label: "Closed",      cls: "market-closed", dot: "●" };
      if (mins < 570)  return { label: "Pre-Market",  cls: "market-pre",    dot: "●" };
      if (mins < 960)  return { label: "Market Open", cls: "market-open",   dot: "●" };
      return             { label: "After Hours",  cls: "market-after",  dot: "●" };
    }
    function updateMarketClock() {
      const { label, cls, dot } = getMarketStatus();
      const el = document.getElementById("market-status");
      el.className = `market-chip ${cls}`;
      el.textContent = `${dot} ${label}`;
    }
    updateMarketClock();
    setInterval(updateMarketClock, 60 * 1000);

    // ── Refresh loop ─────────────────────────────────────────────────────
    function scheduleRefresh() {
      const { cls } = getMarketStatus();
      const interval = (cls === "market-open" || cls === "market-pre" || cls === "market-after")
        ? 60_000        // 1 min during market / extended hours
        : 5 * 60_000;   // 5 min when closed
      setTimeout(async () => { await load(); scheduleRefresh(); }, interval);
    }
    load().then(() => scheduleRefresh());
    loadTopMovers();
    loadSpyQuote();
    loadEarningsWeek();
    setInterval(loadSpyQuote, 60_000);
    setInterval(loadEarningsWeek, 30 * 60_000);
  </script>
</body>
